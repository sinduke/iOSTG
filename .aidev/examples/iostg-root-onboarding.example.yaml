  - id: "GATE-IOSTG-ROOT-DECISION"
    title: "Root ownership decision"
    purpose: "Prevent an Agent from choosing between competing Root paths."
    entry_conditions:
      all:
        - id: "COND-IOSTG-WORK-UNIT-ACTIVE"
          condition:
            kind: "record_match"
            record_kind: "Acceptance"
            selector:
