change_revision:
  id: "CHANGE-IOSTG-ROOT-0001"
  revision: 1
  title: "Choose and implement one canonical iOSTG root flow"
  goal: >-
    Establish one maintainer-approved runtime entry and a verifiable onboarding
    completion transition without erasing competing historical paths.
  non_goals:
    - "Do not choose an application-wide architecture pattern on behalf of the maintainer."
    - "Do not add Firebase, an API, a database, or a third-party dependency."
    - "Do not rewrite or remove historical ContentView/AppView experiments."
    - "Do not push, deploy, mutate an external system, or publish."
  scope_ceiling:
    projects:
      - "iostg"
    components:
      - "iOSTG/iOSTGApp.swift"
      - "iOSTG/ContentView.swift"
      - "iOSTG/Core/AppView/"
      - "iOSTG/Core/Welcome/"
      - "iOSTG/Core/Onboarding/"
      - "iOSTGTests/"
      - "iOSTGUITests/"
    environments:
      - "local_worktree"
      - "local_git_repository"
      - "iOS_Simulator"
  claim_refs:
    - "CLAIM-IOSTG-ROOT-0001"
    - "CLAIM-IOSTG-ROOT-0002"
    - "CLAIM-IOSTG-ROOT-0003"
  decision_refs: []

task_revision:
  id: "TASK-IOSTG-ROOT-0001"
  revision: 1
  change_ref: "CHANGE-IOSTG-ROOT-0001@1"
  title: "Converge Root ownership and onboarding completion"
  goal: >-
    Implement the maintainer-selected Root state ownership and prove first
    launch, completion, relaunch, and reset behavior on the selected path.
  non_goals:
    - "No production service or external data mutation."
    - "No architecture promotion without a separate maintainer DecisionRevision."
    - "No publication implied by successful local verification."
  depends_on: []
  planned_outputs:
    - kind: "decision"
      locator: "DECISION-IOSTG-ROOT-OWNERSHIP@1"
    - kind: "code"
      locator: "maintainer-selected Root and onboarding paths"
    - kind: "test"
      locator: "first-launch, completion, relaunch, and reset coverage"
    - kind: "artifact"
      locator: "revision-bound build, UI-test, and runtime Evidence"
  context_scope:
    required_reads:
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "iOSTG/iOSTGApp.swift"
      - "iOSTG/ContentView.swift"
      - "iOSTG/Core/AppView/AppView.swift"
      - "iOSTG/Core/AppView/AppViewFactory.swift"
      - "iOSTG/Core/Welcome/WelcomeView.swift"
      - "iOSTG/Core/Onboarding/Completed/CompletedView.swift"
    optional_reads:
      - "iOSTGTests/"
      - "iOSTGUITests/"
  capability_bounds:
    default_effect: "deny"
    invariant_forbidden_additions:
      - action: "push"
        target_selector:
          kind: "git_remote"
          values:
            - "any"
      - action: "deploy"
        target_selector:
          kind: "environment"
          values:
            - "any"
      - action: "mutate_external_service"
        target_selector:
          kind: "external_system"
          values:
            - "any"
      - action: "publish"
        target_selector:
          kind: "publication_channel"
          values:
            - "any"
    grantable_actions:
      - "edit"
      - "execute_local"
      - "stage"
      - "commit"
      - "tag"
    scope_ceilings:
      repository_paths:
        - "iOSTG/iOSTGApp.swift"
        - "iOSTG/ContentView.swift"
        - "iOSTG/Core/AppView/"
        - "iOSTG/Core/Welcome/"
        - "iOSTG/Core/Onboarding/"
        - "iOSTGTests/"
        - "iOSTGUITests/"
      commands:
        - "xcodebuild"
        - "xcrun simctl"
      git_refs:
        - "refs/tags/CP-*"
      environments:
        - "local_worktree"
        - "local_git_repository"
        - "iOS_Simulator"
  gate_refs:
    - "GATE-IOSTG-ROOT-DECISION"
    - "GATE-IOSTG-ROOT-IMPLEMENTATION"
    - "GATE-IOSTG-ROOT-VERIFICATION"
    - "GATE-IOSTG-ROOT-STAGE"
    - "GATE-IOSTG-ROOT-COMMIT"
    - "GATE-IOSTG-ROOT-CHECKPOINT"
  context_policy_ref: "CONTEXT-IOSTG-ROOT-0001"

