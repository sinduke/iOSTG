  id: "CONTEXT-IOSTG-ROOT-0001"
  strategy: "progressive_disclosure"
  always_read:
    - "AGENTS.md"
    - ".aidev/examples/iostg-project-policy.example.yaml"
    - ".aidev/examples/iostg-root-onboarding.example.yaml"
    - ".aidev/examples/iostg-root-onboarding.events.example.yaml"
  task_reads:
    - "iOSTG/iOSTGApp.swift"
    - "iOSTG/ContentView.swift"
    - "iOSTG/Core/AppView/AppView.swift"
    - "iOSTG/Core/AppView/AppViewFactory.swift"
    - "iOSTG/Core/Welcome/WelcomeView.swift"
    - "iOSTG/Core/Onboarding/Completed/CompletedView.swift"
  exclude_by_default:
    - "Unrelated historical commits and tutorial chapters"
    - "Build artifacts, DerivedData, and xcuserdata"
    - "Omnia task and Evidence history"
  escalation_rules:
    - when:
        kind: "scope_expansion_requested"
        selector: "navigation_or_persisted_state_ownership"
      add:
        - "Relevant iOSTG tests, ADRs, Experiments, and Checkpoints"
    - when:
        kind: "scope_expansion_requested"
        selector: "xcode_target_scheme_configuration_or_environment"
      add:
        - "iOSTG.xcodeproj/project.pbxproj"
        - "Relevant scheme and configuration sources"
  handoff_requirements:
    include:
      - "project_identity_and_checkout_fingerprint"
      - "schema_policy_and_reducer_revisions"
      - "work_unit_and_task_revisions"
      - "event_stream_id_cursor_and_head_digest"
      - "current_gate_and_gate_evaluations"
      - "decision_revisions_and_pending_acceptances"
      - "grants_with_principal_expiry_uses_and_transferability"
      - "active_run_owner_lease_and_side_effects"
      - "previous_run_terminal_state_and_incomplete_outputs"
      - "valid_stale_and_contested_evidence"
      - "open_conflicts_cleanup_and_rollback_obligations"

runtime_record_sources:
  event_stream:
    id: "EVENTS-IOSTG-ROOT-0001-FIXTURE"
    locator: ".aidev/examples/iostg-root-onboarding.events.example.yaml"
    ordering: "stream_sequence"
  independent_record_kinds:
    - "DecisionRevision"
    - "CapabilityGrant"
    - "Run"
    - "Evidence"
    - "Acceptance"
    - "GateEvaluation"
  derived_projection:
    locator: null
    independent_authority: false
